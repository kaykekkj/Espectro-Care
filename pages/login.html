<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="body-login">

    <header class="header" style="margin-bottom: 10vh;">
        <nav class="navbar-cadastro">
            <a href="../index.html" class="logo-cadastro">
                <img
                    src="../assets/img/logos/Logo.png"
                    alt="EspectroCare"
                >
            </a>

            <a href="../index.html" class="voltar-inicio">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="19"
                    height="19"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>

                <span>Voltar ao início</span>
            </a>
        </nav>
    </header>

    <section class="home" >
        <div class="conteiner-entrar">
        <h1 style="margin-bottom: 30px;">Bem vindo de volta</h1>
        <p>Email</p>
        <input type="email" class="email">
        <p style="margin-top: 30px;">Senha</p>
        <input type="password" class="senha">
        <p style="margin-top: 30px;"><a href="">Esqueci minha senha</a> ou <a class="criar-conta-login" onclick="selecionar()">Não tem uma conta</a> </p>
        <button id="btnLogar" class="botao-logar">Entrar</button>
        </div>
    </section>

    <div class="selecionar" id="selecionar">
        <div class="voltar" onclick="fechar()"><img src="../assets/img/icons/_.png"></div>
            <h1>Criar conta <br><span>Selecione seu perfil para começar</span></h1>
            <div class="cards">
                <a href="cadastro-resp.html"><div><img src="../assets/img/icons/image 5.jpg" alt=""><h1>Responsaveis</h1></div></a>
                <a href="cadastro-profissional.html"><div><img src="../assets/img/icons/image 7.png" alt=""><h1>Profissionais</h1></div></a>
            </div>
        </div>
    <div class="overlay" id="overlay"></div>
    <script src="../assets/js/selecionar-perfil.js"></script>
    <script src="../assets/js/loginEntrar.js"></script>
</body>
</html>
