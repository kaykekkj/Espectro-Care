<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Cadastre-se como responsável na EspectroCare."
    >

    <title>Cadastro de Responsável | EspectroCare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="icon" href="../assets/img/logos/Logo (1).png" type="image/x-icon">

</head>

<body class="body-login">

<header class="header">
    <nav class="navbar-cadastro">
        <a href="../index.html" class="logo-cadastro">
            <img
                src="../assets/img/logos/Logo.png"
                alt="EspectroCare"
            >
        </a>

        <a href="../index.html" class="voltar-inicio">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>

            <span>Voltar ao início</span>
        </a>
    </nav>
</header>

    <main class="home">

        <section
            class="conteiner-entrar"
            aria-labelledby="titulo-cadastro"
        >

            <header>
                <h1 id="titulo-cadastro">
                    Cadastro de responsável
                </h1>

                <p>
                    Preencha seus dados para criar sua conta.
                </p>
            </header>

            <form id="formCadastroResponsavel">

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <div class="campo">
                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="tel">Telefone</label>

                        <input
                            type="tel"
                            id="tel"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            inputmode="numeric"
                            maxlength="15"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            inputmode="numeric"
                            maxlength="14"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="campo autocomplete">
                        <label for="estado">
                            Estado
                        </label>

                        <input
                            type="text"
                            id="estado"
                            name="estado"
                            placeholder="Digite o estado"
                            autocomplete="off"
                            required
                        >

                        <div
                            id="sugestoesEstado"
                            class="lista-autocomplete"
                        ></div>
                    </div>

                    <div class="campo autocomplete">
                        <label for="cidade">
                            Cidade
                        </label>

                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            placeholder="Selecione primeiro o estado"
                            autocomplete="off"
                            disabled
                            required
                        >

                        <div
                            id="sugestoesCidade"
                            class="lista-autocomplete"
                        ></div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Segurança da conta</legend>

                    <div class="senhas">

                        <div class="campo">
                            <label for="senha">
                                Senha
                            </label>

                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="confirmarSenha">
                                Confirme sua senha
                            </label>

                            <input
                                type="password"
                                id="confirmarSenha"
                                name="confirmarSenha"
                                placeholder="Digite sua senha novamente"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                        </div>

                    </div>
                </fieldset>

                <div class="termos">
                    <p>
                        Ao criar sua conta, você concorda com nossos
                        <a href="../termos.html">
                            Termos de Uso
                        </a>
                        e
                        <a href="../privacidade.html">
                            Política de Privacidade
                        </a>.
                    </p>
                </div>

                <button
                    type="button"
                    class="botao-cadastrar"
                    id="btnCadastrarResp"
                >
                    Cadastrar
                </button>

            </form>
        </section>
    </main>
    </section>
    <script src="../assets/js/autocomplete.js"></script>
    <script src="../assets/js/cadastrar-responsavel.js"></script>
</body>
</html>
