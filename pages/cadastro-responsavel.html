<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="body-cadastrarResponsavel">
    <header>
    <nav class="navbar">
        <a class="logo" href="../index.html"><img src="../assets/img/logos/Logo.png" alt="Logo do site" class="logo-voltar" ></a>
    </header>
    <section class="home" >
        <div class="conteiner-entrar">
        <h1>Cadastro responsaveis</h1>
        <p>Nome completo</p>
        <input type="text" id="nome" placeholder="Digite seu nome"> <!-- Input onde sai o valor nome -->
        <p>Email</p>
        <input type="email" id="email" placeholder="Digite seu E-mail"> <!-- Input onde sai o valor email -->
        <p>Telefone</p>
        <input type="tel" id="tel" placeholder="Digite seu telefone"> <!-- Input onde sai o valor telefone -->
            <div class="senhas">
                <div>
                <p>Senha</p> 
                    <input type="password" id="senha" placeholder="Digite sua senha"> <!-- Input onde sai o valor senha -->
                    </div>
                <div>
                    <p>Confirme sua senha</p> 
                    <input type="password" id="confirmarSenha" placeholder="Confirme sua senha"> <!-- Input onde confirma senha -->
                </div>
            </div>

            <p>Estado</p>
        <div class="autocomplete">
            <input
            type="text"
            id="estado"
            placeholder="Digite seu estado"
            autocomplete="off"
            > <!-- Input onde sai o valor estado -->

            <div id="sugestoes"></div>

        </div>
        <p>CPF</p>
        <input type="text" id="cpf" placeholder=" Digite seu CPF"> <!-- Input onde sai o valor cpf -->

        <p>Ao criar sua conta, você concorda com nossos <a href="">Termos de uso</a> e <a href="">Politicas de privacidade</a></p>
        <button class="botao-cadastrar" id="btnCadastrarResp">Cadastrar</button>
        </div>
    </section>
    <script src="../assets/js/autocomplete.js"></script>
    <script>
        console.log(document.getElementById("btnCadastrarResp"));
        document.getElementById("btnCadastrarResp").addEventListener("click", async () => {

    const senha = document.getElementById("senha").value;
    const confirmarSenha = document.getElementById("confirmarSenha").value;

    if (senha !== confirmarSenha) {
        alert("As senhas não coincidem!");
        return;
    }

    const usuario = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        telefone: document.getElementById("tel").value,
        senha: senha,
        estado: document.getElementById("estado").value,
        cpf: document.getElementById("cpf").value
    };

    try {

        const resposta = await fetch(
            "http://localhost:8080/cadastro/responsavel",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(usuario)
            }
        );

        if (resposta.ok) {
            alert("Cadastro realizado com sucesso!");
        } else {
            const erro = await resposta.text();
            alert(erro);
        }

    } catch (e) {
        console.error(e);
        alert("Erro ao conectar com o servidor.");
    }

});
</script>
</body>
</html>
