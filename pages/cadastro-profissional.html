<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="body-login">
    <header>
    <nav class="navbar">
        <a class="logo" href="../index.html"><img src="../assets/img/logos/Logo.png" alt="Logo do site" class="logo-voltar" ></a>
    </header>
    <section class="home" >
        <div class="conteiner-entrar">
        <h1>Cadastro profissionais</h1>
        <p>Nome completo</p>
        <input type="text" id="nomeProf" placeholder="Digite seu nome"> <!-- Input onde sai o valor nome -->
        <p>Email</p>
        <input type="email" id="emailProf" placeholder="Digite seu E-mail"> <!-- Input onde sai o valor email -->
        <p>Telefone</p>
        <input type="tel" id="telProf" placeholder="Digite seu telefone"> <!-- Input onde sai o valor telefone -->
            <div class="senhas">
                <div>
                <p>Senha</p> 
                    <input type="password" id="senhaProf" placeholder="Digite sua senha"> <!-- Input onde sai o valor senha -->
                    </div>
                <div>
                    <p>Confirme dua senha</p> 
                    <input type="password" id="ConfirmarSenhaProf" placeholder="Confirme sua senha"> <!-- Input onde confirma a senha -->
                </div>
            </div>

            <p>Estado</p>
        <div class="autocomplete">
            <input 
            type="text"
            id="estadoProf"
            placeholder="Digite seu estado"
            autocomplete="off"
            >  <!-- Input onde sai o valor estado -->

            <div id="sugestoes"></div>

        </div>

        <p>Principas formação</p>
        <input type="text" id="formacao" placeholder="Ex: Psicólogos, Neuropsicólogos, Etc."> <!-- Input onde sai o valor formação -->
        <p>Número de registro profissional</p>
        <input type="text" id="registro" placeholder="CRP, CREFITO, CREFONO..."> <!-- Input onde sai o valor registro profissional -->
        <p>CPF</p>
        <input type="text" id="cpf" placeholder=" Digite seu CPF"> <!-- Input onde sai o valor cpf -->

        <p>Ao criar sua conta, você concorda com nossos <a href="">Termos de uso</a> e <a href="">Politicas de privacidade</a></p>
        <button class="botao-cadastrar" id="btnCadastrarProf">Cadastrar</button>
        </div>
    </section>
    <script src="../assets/js/autocomplete.js"></script>
        <script src="../assets/js/cadastrar-profissional.js"></script>
</body>
</html>
