<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta
    name="description"
    content="Cadastre-se como profissional na EspectroCare."
>

<title>Cadastro de Profissional | EspectroCare</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<!-- CSS -->
<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body class="body-login">

<!-- ============================================================
     HEADER
     ============================================================ -->

<header class="header">

    <nav class="navbar-cadastro">

        <a href="../index.html" class="logo-cadastro">
            <img
                src="../assets/img/logos/Logo.png"
                alt="EspectroCare"
            >
        </a>

        <a href="../index.html" class="voltar-inicio">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>

            <span>Voltar ao início</span>

        </a>

    </nav>

</header>


<!-- ============================================================
     CONTEÚDO PRINCIPAL
     ============================================================ -->

<main class="home">

    <section
        class="conteiner-entrar"
        aria-labelledby="titulo-cadastro"
    >

        <header>

            <h1 id="titulo-cadastro">
                Cadastro de profissional
            </h1>

            <p>
                Preencha seus dados para criar sua conta profissional.
            </p>

        </header>


        <!-- ====================================================
             FORMULÁRIO
             ==================================================== -->

        <form id="formCadastroProfissional">


            <!-- ==================================================
                 DADOS PESSOAIS
                 ================================================== -->

            <fieldset>

                <legend>Dados pessoais</legend>


                <!-- Nome -->

                <div class="campo">

                    <label for="nomeProf">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nomeProf"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- E-mail -->

                <div class="campo">

                    <label for="emailProf">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailProf"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Telefone -->

                <div class="campo">

                    <label for="telProf">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telProf"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        inputmode="numeric"
                        maxlength="15"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- CPF -->

                <div class="campo">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        inputmode="numeric"
                        maxlength="14"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- ==================================================
                     ESTADO
                     ================================================== -->

                <div class="campo autocomplete">

                    <label for="estado">
                        Estado
                    </label>

                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        placeholder="Digite o estado"
                        autocomplete="off"
                        required
                    >

                    <div
                        id="sugestoesEstado"
                        class="lista-autocomplete"
                    ></div>

                </div>


                <!-- ==================================================
                     CIDADE
                     ================================================== -->

                <div class="campo autocomplete">

                    <label for="cidade">
                        Cidade
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        placeholder="Selecione primeiro o estado"
                        autocomplete="off"
                        disabled
                        required
                    >

                    <div
                        id="sugestoesCidade"
                        class="lista-autocomplete"
                    ></div>

                </div>

            </fieldset>


            <!-- ==================================================
                 DADOS PROFISSIONAIS
                 ================================================== -->

            <fieldset>

                <legend>Dados profissionais</legend>


                <!-- Formação -->

                <div class="campo">

                    <label for="formacao">
                        Principal formação
                    </label>

                    <input
                        type="text"
                        id="formacao"
                        name="formacao"
                        placeholder="Ex.: Psicólogo, Neuropsicólogo..."
                        required
                    >

                </div>


                <!-- Registro -->

                <div class="campo">

                    <label for="registro">
                        Número de registro profissional
                    </label>

                    <input
                        type="text"
                        id="registro"
                        name="registro"
                        placeholder="Ex.: CRP, CREFITO, CREFONO..."
                        required
                    >

                </div>

            </fieldset>


            <!-- ==================================================
                 SEGURANÇA DA CONTA
                 ================================================== -->

            <fieldset>

                <legend>Segurança da conta</legend>

                <div class="senhas">


                    <!-- Senha -->

                    <div class="campo">

                        <label for="senhaProf">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senhaProf"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>


                    <!-- Confirmar senha -->

                    <div class="campo">

                        <label for="confirmarSenhaProf">
                            Confirme sua senha
                        </label>

                        <input
                            type="password"
                            id="confirmarSenhaProf"
                            name="confirmarSenha"
                            placeholder="Digite sua senha novamente"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>

                </div>

            </fieldset>


            <!-- ==================================================
                 TERMOS
                 ================================================== -->

            <div class="termos">

                <p>

                    Ao criar sua conta, você concorda com nossos

                    <a href="../termos.html">
                        Termos de Uso
                    </a>

                    e

                    <a href="../privacidade.html">
                        Política de Privacidade
                    </a>.

                </p>

            </div>


            <!-- ==================================================
                 BOTÃO
                 ================================================== -->

            <button
                type="submit"
                class="botao-cadastrar"
                id="btnCadastrarProf"
            >
                Cadastrar
            </button>

        </form>

    </section>

</main>


<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->

<script src="../assets/js/autocomplete.js"></script>
<script src="../assets/js/cadastrar-profissional.js"></script>

</body>

</html>
