<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Cadastre-se como profissional na EspectroCare."
    >

    <title>Cadastro de Profissional | EspectroCare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="body-login">

<header class="header">
    <nav class="navbar-cadastro">
        <a href="../index.html" class="logo-cadastro">
            <img
                src="../assets/img/logos/Logo.png"
                alt="EspectroCare"
            >
        </a>

        <a href="../index.html" class="voltar-inicio">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>

            <span>Voltar ao início</span>
        </a>
    </nav>
</header>

    <main class="home">

        <section
            class="conteiner-entrar"
            aria-labelledby="titulo-cadastro"
        >

            <header>
                <h1 id="titulo-cadastro">
                    Cadastro de profissional
                </h1>

                <p>
                    Preencha seus dados para criar sua conta profissional.
                </p>
            </header>

            <form id="formCadastroProfissional">

                <fieldset>

                    <legend>Dados pessoais</legend>

                    <div class="campo">
                        <label for="nomeProf">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nomeProf"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="emailProf">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="emailProf"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telProf">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telProf"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="cpf">
                            CPF
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            inputmode="numeric"
                            maxlength="14"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="campo">

                        <label for="estadoProf">
                            Estado
                        </label>

                        <input
                            type="text"
                            id="estadoProf"
                            name="estado"
                            placeholder="Digite ou selecione seu estado"
                            list="listaEstados"
                            autocomplete="off"
                            required
                        >

                        <datalist id="listaEstados"></datalist>

                    </div>

                    <div class="campo">

                        <label for="cidadeProf">
                            Cidade
                        </label>

                        <input
                            type="text"
                            id="cidadeProf"
                            name="cidade"
                            placeholder="Selecione primeiro o estado"
                            list="listaCidades"
                            autocomplete="off"
                            disabled
                            required
                        >

                        <datalist id="listaCidades"></datalist>

                    </div>

                </fieldset>

                <fieldset>

                    <legend>Dados profissionais</legend>

                    <div class="campo">

                        <label for="formacao">
                            Principal formação
                        </label>

                        <input
                            type="text"
                            id="formacao"
                            name="formacao"
                            placeholder="Ex.: Psicólogo, Neuropsicólogo..."
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="registro">
                            Número de registro profissional
                        </label>

                        <input
                            type="text"
                            id="registro"
                            name="registro"
                            placeholder="Ex.: CRP, CREFITO, CREFONO..."
                            required
                        >

                    </div>

                </fieldset>

                <fieldset>

                    <legend>Segurança da conta</legend>

                    <div class="senhas">

                        <div class="campo">

                            <label for="senhaProf">
                                Senha
                            </label>

                            <input
                                type="password"
                                id="senhaProf"
                                name="senha"
                                placeholder="Digite sua senha"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                        </div>

                        <div class="campo">

                            <label for="ConfirmarSenhaProf">
                                Confirme sua senha
                            </label>

                            <input
                                type="password"
                                id="ConfirmarSenhaProf"
                                name="confirmarSenha"
                                placeholder="Digite sua senha novamente"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                        </div>

                    </div>

                </fieldset>

                <div class="termos">

                    <p>
                        Ao criar sua conta, você concorda com nossos
                        <a href="../termos.html">
                            Termos de Uso
                        </a>
                        e
                        <a href="../privacidade.html">
                            Política de Privacidade
                        </a>.
                    </p>

                </div>

                <button
                    type="submit"
                    class="botao-cadastrar"
                    id="btnCadastrarProf"
                >
                    Cadastrar
                </button>

            </form>

        </section>

    </main>

    <script>
        const formulario =
            document.getElementById("formCadastroProfissional");

        const cpfInput =
            document.getElementById("cpf");

        const estadoInput =
            document.getElementById("estadoProf");

        const cidadeInput =
            document.getElementById("cidadeProf");

        const listaEstados =
            document.getElementById("listaEstados");

        const listaCidades =
            document.getElementById("listaCidades");

        const API =
            "https://servicodados.ibge.gov.br/api/v1/localidades";

        let estados = [];


        async function carregarEstados() {
            try {
                const resposta = await fetch(
                    `${API}/estados`
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao carregar estados.");
                }

                estados = await resposta.json();

                estados.sort((a, b) =>
                    a.nome.localeCompare(b.nome)
                );

                listaEstados.innerHTML = "";

                estados.forEach((estado) => {

                    const option =
                        document.createElement("option");

                    option.value = estado.nome;

                    listaEstados.appendChild(option);
                });

            } catch (erro) {
                console.error(erro);
                alert("Não foi possível carregar os estados.");
            }
        }


        async function carregarCidades(nomeEstado) {

            const estado =
                estados.find(
                    (item) =>
                        item.nome.toLowerCase() ===
                        nomeEstado.trim().toLowerCase()
                );

            listaCidades.innerHTML = "";
            cidadeInput.value = "";

            if (!estado) {
                cidadeInput.disabled = true;
                cidadeInput.placeholder =
                    "Selecione primeiro o estado";
                return;
            }

            cidadeInput.disabled = false;
            cidadeInput.placeholder =
                "Digite ou selecione sua cidade";

            try {
                const resposta = await fetch(
                    `${API}/estados/${estado.id}/municipios`
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao carregar cidades.");
                }

                const cidades =
                    await resposta.json();

                cidades.sort((a, b) =>
                    a.nome.localeCompare(b.nome)
                );

                cidades.forEach((cidade) => {

                    const option =
                        document.createElement("option");

                    option.value = cidade.nome;

                    listaCidades.appendChild(option);
                });

            } catch (erro) {
                console.error(erro);

                cidadeInput.disabled = true;

                alert(
                    "Não foi possível carregar as cidades."
                );
            }
        }


        cpfInput.addEventListener("input", function () {

            let cpf =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 11);

            if (cpf.length <= 3) {

                this.value = cpf;

            } else if (cpf.length <= 6) {

                this.value = cpf.replace(
                    /^(\d{3})(\d+)/,
                    "$1.$2"
                );

            } else if (cpf.length <= 9) {

                this.value = cpf.replace(
                    /^(\d{3})(\d{3})(\d+)/,
                    "$1.$2.$3"
                );

            } else {

                this.value = cpf.replace(
                    /^(\d{3})(\d{3})(\d{3})(\d{1,2})/,
                    "$1.$2.$3-$4"
                );
            }
        });


        estadoInput.addEventListener(
            "change",
            () => {
                carregarCidades(
                    estadoInput.value
                );
            }
        );


        formulario.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const senha =
                    document
                        .getElementById("senhaProf")
                        .value;

                const confirmarSenha =
                    document
                        .getElementById("ConfirmarSenhaProf")
                        .value;

                if (senha !== confirmarSenha) {
                    alert("As senhas não coincidem!");
                    return;
                }

                const cpf =
                    cpfInput.value.replace(/\D/g, "");

                if (cpf.length !== 11) {
                    alert(
                        "Digite um CPF com 11 números."
                    );
                    return;
                }

                const estado =
                    estados.find(
                        (item) =>
                            item.nome.toLowerCase() ===
                            estadoInput.value.trim().toLowerCase()
                    );

                if (!estado) {
                    alert("Selecione um estado válido.");
                    return;
                }

                const cidadeSelecionada =
                    cidadeInput.value.trim();

                if (!cidadeSelecionada) {
                    alert("Selecione uma cidade.");
                    return;
                }

                const usuario = {

                    nome:
                        document
                            .getElementById("nomeProf")
                            .value
                            .trim(),

                    email:
                        document
                            .getElementById("emailProf")
                            .value
                            .trim(),

                    telefone:
                        document
                            .getElementById("telProf")
                            .value
                            .trim(),

                    senha,

                    estado:
                        estado.nome,

                    cidade:
                        cidadeSelecionada,

                    cpf,

                    numRegistro:
                        document
                            .getElementById("registro")
                            .value
                            .trim(),

                    formacao:
                        document
                            .getElementById("formacao")
                            .value
                            .trim()
                };

                try {

                    const resposta =
                        await fetch(
                            "https://espectrocare.onrender.com/cadastro/profissional",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(usuario)
                            }
                        );

                    if (resposta.ok) {

                        alert(
                            "Cadastro realizado com sucesso!"
                        );

                        formulario.reset();

                        cidadeInput.disabled = true;

                        cidadeInput.placeholder =
                            "Selecione primeiro o estado";

                        listaCidades.innerHTML = "";

                    } else {

                        const erro =
                            await resposta.text();

                        alert(
                            erro ||
                            `Erro no cadastro. Código HTTP: ${resposta.status}`
                        );
                    }

                } catch (erro) {

                    console.error(erro);

                    alert(
                        "Não foi possível conectar ao servidor. " +
                        "Tente novamente."
                    );
                }
            }
        );


        carregarEstados();
    </script>

</body>
</html>
